[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epistora"
version = "0.1.0"
description = "Local-first personal knowledge compiler that turns saved links and documents into a persistent, queryable knowledge base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer[all]>=0.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.3.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=2.0.0",
    "youtube-transcript-api>=0.6.0",
    "pymupdf>=1.25.0",
    "python-frontmatter>=1.1.0",
    "python-slugify>=8.0.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[project.scripts]
kb = "app.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring network or API keys",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
