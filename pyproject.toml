[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epistora"
version = "0.1.0"
description = "Local-first personal knowledge compiler that turns saved links and documents into a persistent, queryable knowledge base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Epistora Contributors" }]
keywords = ["knowledge-base", "bookmarks", "obsidian", "markdown", "cli", "raindrop", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.3.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=2.0.0",
    "lxml_html_clean>=0.4.0",
    "youtube-transcript-api>=0.6.0",
    "pymupdf>=1.25.0",
    "python-frontmatter>=1.1.0",
    "python-slugify>=8.0.0",
    "beautifulsoup4>=4.12.0",
    "aiosqlite>=0.20.0",
    "readability-lxml>=0.8.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[project.scripts]
epistora = "app.cli.main:app"
eps = "app.cli.main:app"

[project.urls]
Homepage = "https://github.com/joeljstephen/epistora"
Documentation = "https://github.com/joeljstephen/epistora#readme"
Repository = "https://github.com/joeljstephen/epistora"
Issues = "https://github.com/joeljstephen/epistora/issues"
Changelog = "https://github.com/joeljstephen/epistora/blob/main/docs/ROADMAP.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring network or API keys",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
include = [
    "knowledge_vault_template/**",
    "prompts/**",
    "studio/**",
]

[tool.hatch.build.targets.sdist]
include = [
    ".env.example",
    "app/",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "docs/",
    "knowledge_vault_template/",
    "LICENSE",
    "prompts/",
    "studio/",
    "README.md",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
